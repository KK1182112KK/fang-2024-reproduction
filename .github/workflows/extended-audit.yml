name: Extended Fang 2024 audit

on:
  push:
    branches: [main]
    paths:
      - 'extended-audit-2026-09/**'
      - 'README.md'
      - '.github/workflows/extended-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extended-audit-2026-09/**'
      - 'README.md'
      - '.github/workflows/extended-audit.yml'

jobs:
  extended-audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extended-audit-2026-09
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: extended-audit-2026-09/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_audit.py
      - run: python audit.py --out ci-results --no-plots
      - uses: actions/upload-artifact@v4
        with:
          name: fang-extended-main-audit
          path: extended-audit-2026-09/ci-results
          retention-days: 7
